version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    ports:
      - "5173:5173"
      - "9229:9229"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:5173
    stdin_open: true
    tty: true
