<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Top Holidays</title>
    <style>
      body { font-family: Inter, system-ui, sans-serif; margin: 0; background: #F7FAFC; color: #2D3748; display: grid; place-items: center; height: 100vh; }
      .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 420px; }
      h1 { font-size: 24px; margin-bottom: 8px; }
      p { font-size: 16px; margin: 0 0 16px; }
      button { background: #10B981; color: white; border: none; padding: 12px 16px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're Offline</h1>
      <p>Please check your connection. We'll retry when online.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
